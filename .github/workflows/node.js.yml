# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    paths:
      - 'shoppinglist-frontend/**'
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    paths:
      - 'shoppinglist-frontend/**'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # LTS releases only. Angular 22 requires ^22.22.3 || ^24.15.0 || >=26.0.0,
        # so Node 20 is dropped (EOL April 2026 and no longer supported by Angular).
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: shoppinglist-frontend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: shoppinglist-frontend/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test -- --watch=false
